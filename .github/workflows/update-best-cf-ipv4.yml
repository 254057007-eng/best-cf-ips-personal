name: Update Best CF IPv4

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: update-best-cf-ipv4
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Collect public IPv4 addresses
        run: python scripts/best-cf-ipv4-collector.py

      - name: Validate generated pool
        run: python scripts/validate_output.py best-cf-ipv4.txt --min-count 50

      - name: Commit changed pool
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add best-cf-ipv4.txt
          if git diff --cached --quiet; then
            echo "No address-pool changes"
            exit 0
          fi
          git commit -m "Update best CF IPv4 list $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
